<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freie Bühne Basel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=FjDSxSGU2x-Z923saOD0qDyRl2O3XsmP0ZsWIB1te_XnI_8dUlNJqVaL6TUvvWjd4ER8_2FkVR7jXVNcW7pWL9kJv3nHmBczek0a8_mbrcxLfBNu9-mRE7uh5T2-uts0f6a6rXypjtGBzkiHO53hdxYJYcCd1RTJGZiYua7KCnEsqK-GwfKnUY6HwhYm6RTKzOJtX4ytghwQ152sVk9veJUxZM4D2YgFuQsRdHLc90UHLCo9E9vBFxwTM72QOSNJT8JTAfC7Xxodn4s-YXokag" charset="UTF-8"></script><style>
    body { font-family: 'Inter', sans-serif; margin:0; padding:0; background:#fff; color:#111; line-height:1.6; }
    header { background:#000; color:white; padding:4rem 2rem; text-align:center; }
    header h1 { font-family: 'Cinzel Decorative', cursive; font-size:3rem; margin:0; color:#D4AF37; }
    h2 { font-family: 'Cinzel Decorative', cursive; color:#D4AF37; border-bottom:2px solid #D4AF37; padding-bottom:0.3rem; margin-top:2rem; }
    h3 { font-family: 'Cinzel Decorative', cursive; color:#D4AF37; margin-top:1rem; }
    main { padding:2rem; max-width:1000px; margin:auto; }
    ul { list-style:none; padding:0; }
    li { margin-bottom:1rem; }
    a { color:#D4AF37; text-decoration:none; }
    footer { text-align:center; font-size:0.9rem; color:#666; padding:2rem; }

    .hero-slider { position: relative; width: 100%; height: 500px; overflow: hidden; background:#fff; margin-top: 1.5rem; }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease-in-out; }
    .hero-slide img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .hero-slide.active { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Freie Bühne Basel</h1>
    <p>Bewegendes Theater für alle</p>
  </header>

  <div class="hero-slider">
    <div class="hero-slide active"><img src="bilder/hero/hero1.jpg" alt=""></div>
    <div class="hero-slide"><img src="bilder/hero/hero2.jpg" alt=""></div>
  </div>

  <main>
    <h2>Über uns</h2>
    <p>Die Freie Bühne Basel ist ein junger Theaterverein.</p>
  </main>

  <footer>&copy; 2025 Freie Bühne Basel</footer>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    let currentSlide = 0;
    const slides = document.querySelectorAll('.hero-slide');

    setInterval(() => {
      if (!slides.length) return;
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 5000);
  });
  </script>

</body>
</html>
